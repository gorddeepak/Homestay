name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Dummy, test-only configuration. The suites replace provider calls with
      # doubles and refuse outbound network requests.
      NODE_ENV: test
      SECRET: ci-test-session-secret-not-for-production
      CLOUD_NAME: ci-test-cloud
      CLOUD_API_KEY: ci-test-key
      CLOUD_API_SECRET: ci-test-secret
      MAPTILER_API_KEY: ci-test-maptiler
      GEMINI_API_KEY: ""
      GOOGLE_GENERATIVE_AI_API_KEY: ci-test-google
      AUTH_JWT_SECRET: ci-test-jwt-secret-0123456789abcdef0123456789abcdef
      ENVIRONMENT: development
      AUTH_COOKIE_SECURE: "false"
      AUTH_ALLOWED_ORIGINS: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install root dependencies
        run: npm ci --legacy-peer-deps

      - name: Node/Express tests
        run: npm test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Check for whitespace errors
        run: git diff --check
